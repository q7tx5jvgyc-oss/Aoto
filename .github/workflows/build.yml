- name: Install dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y git make perl clang dpkg-dev curl wget

    # تثبيت ldid بطريقة صحيحة
    wget https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux.zip
    unzip ldid_linux.zip
    sudo mv ldid /usr/local/bin/ldid
    sudo chmod +x /usr/local/bin/ldid
