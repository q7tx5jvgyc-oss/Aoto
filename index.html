<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التكبيس</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #fff;
        }
        .button {
            width: 90%;
            padding: 12px 0;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .button.green {
            background-color: #28a745;
        }
        .button.green:active {
            background-color: #218838;
        }
        .button.dark-gray {
            background-color: #4a4a4a;
        }
        .button.dark-gray:active {
            background-color: #3a3a3a;
        }
        .slider-container {
            display: flex;
            align-items: center;
            width: 90%;
            margin-bottom: 15px;
        }
        .slider-container label {
            font-size: 16px;
            margin-right: 10px;
            white-space: nowrap;
        }
        .slider-container input[type="range"] {
            flex-grow: 1;
            -webkit-appearance: none;
            height: 5px;
            background: #555;
            border-radius: 5px;
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        .slider-container .ultra-label {
            font-size: 16px;
            margin-left: 10px;
            color: yellow;
            font-weight: bold;
        }
        .instructions {
            font-size: 12px;
            color: #ccc;
            margin-top: 15px;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>
    <h1>أداة التكبيس 🚀</h1>

    <button class="button green" id="runStopButton">تشغيل</button>

    <div class="slider-container">
        <label for="speedSlider">السرعة:</label>
        <input type="range" id="speedSlider" min="0" max="100" value="50">
        <span class="ultra-label">ULTRA</span>
    </div>

    <button class="button dark-gray">إضافة هدف +</button>
    <button class="button dark-gray">مسح الأهداف 🗑️</button>
    <button class="button dark-gray">إخفاء اللوحة 👁️‍🗨️</button>

    <p class="instructions">اسحب الهدف لتحريكه - ضغط مطول لحذفه</p>

    <script>
        document.getElementById('runStopButton').addEventListener('click', function() {
            if (this.textContent === 'تشغيل') {
                this.textContent = 'إيقاف';
                this.style.backgroundColor = '#dc3545'; // Red color for stop
            } else {
                this.textContent = 'تشغيل';
                this.style.backgroundColor = '#28a745'; // Green color for run
            }
        });
    </script>
</body>
</html>
